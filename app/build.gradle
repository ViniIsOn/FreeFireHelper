plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vini.freefirehelper'
    compileSdk 35

    defaultConfig {
        applicationId 'com.vini.freefirehelper'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // OCR local; as imagens e os vídeos não são enviados a um servidor.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
